name: Gitleaks
# Repo-Hygiene (P01_CC3149, A-15260): Geheimnis-Scan ueber die gesamte Historie.
# Bekannte Altbefunde (Testwerte) stehen redigiert in .gitleaks-baseline.json und werden nicht erneut gemeldet;
# jeder NEUE Treffer macht den Job rot. Werte werden nie ausgegeben (--redact).
on:
  push:
    branches: [main, "nacht/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 holen und pruefen
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks version
      - name: Historie scannen
        run: ./gitleaks git . --redact --no-banner --baseline-path .gitleaks-baseline.json --exit-code 1
